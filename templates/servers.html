{% extends "base.html" %}

{% block title %}Easy Server - Мои серверы{% endblock %}

{% block content %}
<h2>📋 Мои серверы</h2>

<div id="alert-container"></div>

<div style="margin-bottom: 20px;">
    <button onclick="loadServers()" style="background: #28a745;">🔄 Обновить</button>
    <a href="/create" style="padding: 12px 24px; background: #667eea; color: white; text-decoration: none; border-radius: 5px; display: inline-block; cursor: pointer;">➕ Создать сервер</a>
</div>

<div id="servers-container">
    <div class="empty-state">
        <h3>Загрузка серверов...</h3>
        <div class="spinner"></div>
    </div>
</div>

<script>
function loadServers() {
    $.ajax({
        url: '/api/servers',
        method: 'GET',
        success: function(data) {
            if (data.success && data.servers) {
                const servers = data.servers;
                
                if (servers.length === 0) {
                    $('#servers-container').html(`
                        <div class="empty-state">
                            <h3>Нет серверов</h3>
                            <p><a href="/create">Создайте первый сервер</a></p>
                        </div>
                    `);
                    return;
                }

                let html = `<table>
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Тип</th>
                            <th>Порт</th>
                            <th>Макс. игроков</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>`;

                servers.forEach(server => {
                    const statusBadge = server.status === 'running' 
                        ? '<span class="status-badge status-running">🟢 Запущен</span>'
                        : '<span class="status-badge status-stopped">🔴 Остановлен</span>';
                    
                    const actionBtn = server.status === 'running'
                        ? `<button class="btn-danger" onclick="stopServer('${server.name}')">⏹️ Стоп</button>`
                        : `<button class="btn-success" onclick="startServer('${server.name}')">▶️ Старт</button>`;

                    html += `<tr>
                        <td><strong>${server.name}</strong></td>
                        <td>${server.type}</td>
                        <td>${server.port}</td>
                        <td>${server.max_players}</td>
                        <td>${statusBadge}</td>
                        <td>
                            ${actionBtn}
                            <button class="btn-secondary" onclick="showStatus('${server.name}')">📊 Статус</button>
                            <button class="btn-danger" onclick="deleteServer('${server.name}')">🗑️ Удалить</button>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table>';
                $('#servers-container').html(html);
            } else {
                showAlert('Ошибка загрузки серверов', 'error');
            }
        },
        error: function(err) {
            showAlert('Ошибка подключения к серверу', 'error');
        }
    });
}

function startServer(serverName) {
    $.ajax({
        url: `/api/servers/${serverName}/start`,
        method: 'POST',
        success: function(data) {
            if (data.success) {
                showAlert(data.message, 'success');
                setTimeout(loadServers, 1000);
            } else {
                showAlert(data.error, 'error');
            }
        },
        error: function(err) {
            showAlert('Ошибка при запуске сервера', 'error');
        }
    });
}

function stopServer(serverName) {
    if (!confirm(`Вы уверены, что хотите остановить ${serverName}?`)) return;
    
    $.ajax({
        url: `/api/servers/${serverName}/stop`,
        method: 'POST',
        success: function(data) {
            if (data.success) {
                showAlert(data.message, 'success');
                setTimeout(loadServers, 1000);
            } else {
                showAlert(data.error, 'error');
            }
        },
        error: function(err) {
            showAlert('Ошибка при остановке сервера', 'error');
        }
    });
}

function deleteServer(serverName) {
    if (!confirm(`Вы уверены, что хотите удалить ${serverName}?`)) return;
    
    $.ajax({
        url: `/api/servers/${serverName}/delete`,
        method: 'POST',
        success: function(data) {
            if (data.success) {
                showAlert(data.message, 'success');
                setTimeout(loadServers, 1000);
            } else {
                showAlert(data.error, 'error');
            }
        },
        error: function(err) {
            showAlert('Ошибка при удалении сервера', 'error');
        }
    });
}

function showStatus(serverName) {
    $.ajax({
        url: `/api/servers/${serverName}/status`,
        method: 'GET',
        success: function(data) {
            if (data.success) {
                const status = data.status;
                let statusText = `Сервер: ${status.name}\nТип: ${status.type}\nПорт: ${status.port}\nСтатус: ${status.status}`;
                
                if (status.cpu_percent !== undefined) {
                    statusText += `\nCPU: ${status.cpu_percent.toFixed(1)}%`;
                }
                if (status.memory_mb !== undefined) {
                    statusText += `\nПамять: ${status.memory_mb.toFixed(1)} MB`;
                }
                if (status.pid !== undefined) {
                    statusText += `\nPID: ${status.pid}`;
                }
                
                alert(statusText);
            } else {
                showAlert(data.error, 'error');
            }
        },
        error: function(err) {
            showAlert('Ошибка при получении статуса', 'error');
        }
    });
}

function showAlert(message, type) {
    const alertClass = type === 'error' ? 'error' : 'success';
    const alertHtml = `<div class="alert ${alertClass}">${message}</div>`;
    $('#alert-container').html(alertHtml);
    
    if (type !== 'error') {
        setTimeout(() => $('#alert-container').html(''), 3000);
    }
}

$(document).ready(function() {
    loadServers();
    setInterval(loadServers, 10000); // Обновлять каждые 10 секунд
});
</script>
{% endblock %}
